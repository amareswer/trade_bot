# Logrotate config for the crypto trading bot.
#
# Path below matches INSTALL_DIR in deploy.sh / WorkingDirectory in
# trade_bot.service (/opt/trade_bot) — this file is ready to copy as-is,
# no placeholder substitution needed. If you deploy to a different path,
# update the path below AND deploy.sh/trade_bot.service to match — all
# three must agree, same as any other path convention in this deploy/ dir.
#
# Install:
#   sudo cp deploy/logrotate_trade_bot.conf /etc/logrotate.d/trade_bot
#   sudo logrotate -d /etc/logrotate.d/trade_bot   # dry-run test (no changes)
#   sudo logrotate -f /etc/logrotate.d/trade_bot   # force first rotation
#
# After install logrotate runs automatically via cron/systemd-timer (weekly).
# This is also referenced directly from VPS_SETUP.md step 7 — that step
# copies this file rather than duplicating its contents inline, so there's
# only one copy of the actual rotation policy to keep correct.

/opt/trade_bot/logs/trade_bot.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
